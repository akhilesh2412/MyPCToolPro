name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Generate icon assets
        shell: pwsh
        run: |
          pip install pillow
          python scripts/make_assets.py

      - name: Build EXE (self-contained, single-file)
        shell: pwsh
        run: dotnet publish src/MyPCToolPro.csproj -c Release -o dist

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y

      - name: Build Installer
        shell: pwsh
        run: |
          Copy-Item dist/MyPCToolPro.exe installer/
          Copy-Item src/app.ico installer/
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer/installer.nsi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyPCToolPro
          path: |
            dist/MyPCToolPro.exe
            installer/MyPCToolPro-Setup.exe

      - name: Publish Release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MyPCToolPro.exe
            installer/MyPCToolPro-Setup.exe
          generate_release_notes: true
